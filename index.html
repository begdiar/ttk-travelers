<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТТК бара Travelers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky toolbar (search + group tabs) over a card grid; drink opens in a side sheet (full screen on phones). */
:root{
  --bg:#f2f1ec; --surface:#ffffff; --ink:#1c1b18; --muted:#6c6a62; --line:#e2dfd6;
  --accent:#1e5a47; --accent-ink:#ffffff; --accent-soft:#e1ece6; --warn:#9a4a12; --warn-soft:#f7e9dc; --star:#c58a00;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141513; --surface:#1d1f1c; --ink:#ecebe6; --muted:#a3a197; --line:#30322e;
  --accent:#6cc3a3; --accent-ink:#0f1f19; --accent-soft:#203a31; --warn:#f0a56b; --warn-soft:#3a2617; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141513; --surface:#1d1f1c; --ink:#ecebe6; --muted:#a3a197; --line:#30322e;
  --accent:#6cc3a3; --accent-ink:#0f1f19; --accent-soft:#203a31; --warn:#f0a56b; --warn-soft:#3a2617; --star:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:12px;align-items:center;padding:14px 0 10px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0}
.search{flex:1;position:relative}
.search input{width:100%;height:46px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 42px 0 42px;font:inherit;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;display:none;font-size:20px}
.search.has .clear{display:block}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab .n{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.8}
.tab.fav .s{color:var(--star)}
.tab.fav[aria-pressed="true"] .s{color:inherit}
main{padding:18px 0 60px}
.status{color:var(--muted);font-size:14px;margin:0 0 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
section.grp{margin:0 0 26px}
section.grp h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 12px;text-wrap:balance;display:flex;align-items:baseline;gap:10px}
section.grp h2 span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:112px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
.card:active{transform:scale(.99)}
.card h3{margin:0;font-size:16.5px;font-weight:800;line-height:1.25;padding-right:26px}
.card .ing{font-size:13.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .hit{font-size:13px;color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chip{font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.g{background:transparent;border:1px solid var(--line);color:var(--muted)}
.card .st{position:absolute;right:10px;top:10px;color:var(--star);font-size:17px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.on{transform:none;visibility:visible;box-shadow:-10px 0 40px rgba(0,0,0,.18);transition:transform .22s ease}
.sh-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.sh-head .t{flex:1}
.sh-head .grpname{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sh-head h2{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;text-wrap:balance}
.ibtn{flex:none;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:20px}
.ibtn.on{color:var(--star);border-color:var(--star)}
.sh-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h3{margin:0 0 10px;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
table.ing{width:100%;border-collapse:collapse}
table.ing td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
table.ing tr:last-child td{border-bottom:0}
table.ing td.a{text-align:right;font-weight:800;font-size:17px;white-space:nowrap;padding-left:12px;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:5px;white-space:nowrap}
.mult{display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0}
.mult button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:16px;line-height:1}
.mult output{min-width:62px;text-align:center;font-weight:800;color:var(--ink);font-size:13px}
.yld{margin-top:8px;font-size:14px;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 8px;border-radius:10px;cursor:pointer;line-height:1.45}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:-1px}
ol.steps li:hover{background:var(--bg)}
ol.steps li.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
ol.steps li.done::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
ol.steps li.note{cursor:default;font-size:14px;color:var(--muted)}
ol.steps li.note::before{content:"*";background:transparent}
.hint{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px;font-weight:600;font-size:14.5px}
dl.srv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dl.srv dt{font-weight:800;font-size:14px;color:var(--muted)}
dl.srv dd{margin:0}
.meta{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.nav{display:flex;gap:8px}
.nav button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;font-weight:700;cursor:pointer;font-size:14px}
.nav button:disabled{opacity:.4;cursor:default}
footer{color:var(--muted);font-size:13px;padding:0 0 30px}
@media (max-width:640px){
  .bar{flex-wrap:wrap}.brand{width:100%}.brand small{display:inline;margin-left:8px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px;min-height:104px}.card h3{font-size:15px}.card .ing{display:none}
}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
body.locked header.top,body.locked main,body.locked footer{display:none}
.lock{display:none;min-height:100%;place-items:center;padding:24px 16px}
body.locked .lock{display:grid}
.lock-card{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
.lock-card .brand{margin-bottom:8px}
.lock-card label{font-weight:700;font-size:14px;color:var(--muted)}
.lock-card input{height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:17px;background:var(--bg);color:var(--ink)}
.lock-card input:focus{outline:none;border-color:var(--accent)}
.lock-card button{height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;cursor:pointer}
.lock-card button:disabled{opacity:.6}
.lock-err{color:var(--warn);font-weight:700;margin:0;min-height:1.2em;font-size:14px}
.lock-hint{color:var(--muted);font-size:13px;margin:0}
.logout{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;height:46px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
</style>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<div id="lock" class="lock"><form id="lockForm" class="lock-card" autocomplete="off">
<div class="brand">ТТК бара<small>Tashkent Travelers Coffee</small></div>
<label for="pw">Пароль</label>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
<button type="submit" id="pwBtn">Открыть</button>
<p class="lock-err" id="pwErr" role="alert"></p>
<p class="lock-hint">Устройство запомнит пароль на 30 дней.</p>
</form></div>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">ТТК бара<small>Tashkent Travelers Coffee</small></div>
      <div class="search" id="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Название или ингредиент: латте, матча, лайм…" autocomplete="off" aria-label="Поиск напитка">
        <button class="clear" id="clr" aria-label="Очистить поиск">×</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Группы напитков"></nav>
  </div>
</header>
<main class="wrap">
  <p class="status" id="status"></p>
  <div id="list"></div>
</main>
<footer class="wrap">Данные из технологических карт бара. Количество — на одну порцию: г — граммы, мл — миллилитры, п/ф — полуфабрикат, с/м — свежемороженое.</footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" aria-hidden="true">
  <div class="sh-head">
    <div class="t"><div class="grpname" id="shGroup"></div><h2 id="shTitle"></h2></div>
    <button class="ibtn" id="shFav" aria-label="Добавить в избранное">☆</button>
    <button class="ibtn" id="shClose" aria-label="Закрыть">✕</button>
  </div>
  <div class="sh-body" id="shBody"></div>
</aside>

<script>
function startApp(DATA){
const GROUPS = DATA.groups, DRINKS = DATA.drinks;
const GNAME = Object.fromEntries(GROUPS);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let favs = new Set(store.get('ttk-favs', []));
let state = { g: store.get('ttk-group', 'all'), q: '' };
if (state.g !== 'all' && state.g !== 'fav' && !GNAME[state.g]) state.g = 'all';

// search helpers: ё→е, lower case, wrong keyboard layout (qwerty → йцукен)
const EN = "qwertyuiop[]asdfghjkl;'zxcvbnm,.`", RU = "йцукенгшщзхъфывапролджэячсмитьбюё";
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9%]+/g,' ').trim();
const swapLayout = s => s.toLowerCase().split('').map(c => { const i = EN.indexOf(c); return i >= 0 ? RU[i] : c; }).join('');
DRINKS.forEach(d => {
  d.nName = norm(d.name);
  d.nIng = [...new Set(d.v.flatMap(v => v.ing.map(i => i[0])))].map(n => [n, norm(n)]);
  d.noTech = d.v.every(v => !v.steps.length);
});

function match(d, words){
  if (!words.length) return { ok:true, by:null };
  const inName = words.every(w => d.nName.split(' ').some(t => t.startsWith(w)) || d.nName.includes(w));
  if (inName) return { ok:true, by:'name' };
  const hits = [];
  const ok = words.every(w => {
    if (d.nName.includes(w)) return true;
    const h = d.nIng.find(([, n]) => n.includes(w));
    if (h) { hits.push(h[0]); return true; }
    return false;
  });
  return { ok, by: ok ? 'ing' : null, hits };
}
function search(q){
  const words = norm(q).split(' ').filter(Boolean);
  let res = DRINKS.map(d => ({ d, m: match(d, words) })).filter(x => x.m.ok);
  let swapped = false;
  if (words.length && !res.length && /[a-z]/i.test(q)) {
    const w2 = norm(swapLayout(q)).split(' ').filter(Boolean);
    res = DRINKS.map(d => ({ d, m: match(d, w2) })).filter(x => x.m.ok);
    swapped = res.length ? swapLayout(q) : false;
  }
  return { res, swapped };
}

function renderTabs(counts){
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const items = [['all','Все',total], ...GROUPS.map(([g,n]) => [g,n,counts[g]||0]), ['fav','Избранное',null]];
  $('#tabs').innerHTML = items.map(([g,n,c]) => {
    const fav = g === 'fav';
    const num = fav ? favs.size : c;
    return `<button class="tab${fav?' fav':''}" data-g="${g}" aria-pressed="${state.g===g}">${fav?'<span class="s">★</span>':''}${esc(n)}<span class="n">${num}</span></button>`;
  }).join('');
}
function cardHTML(d, m){
  const v0 = d.v[0];
  const sizes = d.v.length > 1 ? d.v.map(v => `<span class="chip">${esc(v.label)}</span>`).join('') : '';
  const ingTxt = v0.ing.slice(0,4).map(i => i[0].replace(' (п/ф)','')).join(', ');
  const hit = m && m.by === 'ing' && m.hits.length ? `<div class="hit">в составе: ${esc([...new Set(m.hits)].join(', '))}</div>` : '';
  const grp = state.g === 'all' || state.g === 'fav' ? '' : '';
  return `<button class="card" data-id="${d.id}">
    ${favs.has(d.id) ? '<span class="st" aria-label="В избранном">★</span>' : ''}
    <h3>${esc(d.name)}</h3>
    ${hit || `<div class="ing">${esc(ingTxt)}</div>`}
    <div class="chips">${sizes}${d.noTech ? '<span class="chip warn">нет технологии</span>' : ''}${grp}</div>
  </button>`;
}
let visible = [];
function render(){
  const { res, swapped } = search(state.q);
  const counts = {}; res.forEach(x => counts[x.d.g] = (counts[x.d.g]||0) + 1);
  renderTabs(counts);
  let shown = res.filter(x => state.g === 'all' || (state.g === 'fav' ? favs.has(x.d.id) : x.d.g === state.g));
  shown.sort((a,b) => (a.m.by === 'ing') - (b.m.by === 'ing'));
  visible = shown.map(x => x.d.id);
  const st = [];
  st.push(`<span>${shown.length ? `Найдено: <b>${shown.length}</b>` : ''}${swapped ? ` · ищу «${esc(swapped)}»` : ''}</span>`);
  $('#status').innerHTML = state.q || state.g !== 'all' ? st.join('') : `<span>${DRINKS.length} напитков · ${DRINKS.reduce((a,d)=>a+d.v.length,0)} техкарт</span><span>Нажмите на напиток, чтобы открыть рецепт</span>`;
  const list = $('#list');
  if (!shown.length){
    if (state.g === 'fav' && !state.q) list.innerHTML = `<div class="empty"><b>Здесь пока пусто.</b><br>Откройте напиток и нажмите ☆, чтобы он появился в избранном.</div>`;
    else list.innerHTML = `<div class="empty"><b>Ничего не нашлось по «${esc(state.q)}».</b><br>Попробуйте часть слова — например «капуч» или «манго»${state.g!=='all'?', или выберите группу «Все»':''}.</div>`;
    return;
  }
  const byG = {};
  shown.forEach(x => (byG[x.d.g] = byG[x.d.g] || []).push(x));
  const order = state.g === 'all' || state.g === 'fav' ? GROUPS.map(g => g[0]) : [state.g];
  list.innerHTML = order.filter(g => byG[g]).map(g => `<section class="grp"><h2>${esc(GNAME[g])}<span>${byG[g].length}</span></h2><div class="grid">${byG[g].map(x => cardHTML(x.d, x.m)).join('')}</div></section>`).join('');
}

// sheet
let cur = null, curV = 0, mult = 1, lastFocus = null;
function fmtAmount(a){
  const m = a.match(/^([\d.,]+)\s*(.*)$/);
  if (!m || mult === 1) return esc(a);
  let v = parseFloat(m[1].replace(',','.')) * mult, u = m[2];
  if (u === 'порция') u = mult*1 < 2 ? 'порция' : (mult < 5 ? 'порции' : 'порций');
  return esc((Math.round(v*10)/10).toString().replace('.',',') + ' ' + u);
}
function ingHTML(n){
  let name = n, tag = '';
  if (n.endsWith(' (п/ф)')) { name = n.slice(0,-6); tag = '<span class="tag">п/ф</span>'; }
  name = name.replace(/\s+с\/м$/, m => { tag += '<span class="tag">с/м</span>'; return ''; });
  return esc(name) + tag;
}
function renderSheet(){
  const d = DRINKS[cur], v = d.v[curV];
  $('#shGroup').textContent = GNAME[d.g];
  $('#shTitle').textContent = d.name;
  const fb = $('#shFav'); const on = favs.has(d.id);
  fb.textContent = on ? '★' : '☆'; fb.classList.toggle('on', on);
  fb.setAttribute('aria-label', on ? 'Убрать из избранного' : 'Добавить в избранное');
  const seg = d.v.length > 1 ? `<div class="seg" role="group" aria-label="Объём">${d.v.map((x,i) => `<button data-v="${i}" aria-pressed="${i===curV}">${esc(x.label)}</button>`).join('')}</div>` : '';
  const ing = `<div class="box"><h3><span>Состав</span><span class="mult" aria-label="Количество порций"><button data-m="-1" aria-label="Меньше порций">−</button><output>${mult} ${mult===1?'порция':mult<5?'порции':'порций'}</output><button data-m="1" aria-label="Больше порций">+</button></span></h3>

(function(){
  const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
  const KEY='ttk-key', DAYS=30;
  document.body.classList.add('locked');
  async function tryKey(key){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(ENC.iv)},key,u8(ENC.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function open(data){
    document.body.classList.remove('locked');
    const b=document.createElement('button');b.className='logout';b.textContent='Выйти';b.id='logout';
    b.addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){};location.reload();});
    document.querySelector('.bar').appendChild(b);
    startApp(data);
  }
  async function fromSaved(){
    try{
      const s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!s||Date.now()>s.exp)return false;
      const key=await crypto.subtle.importKey('raw',u8(s.k),'AES-GCM',true,['decrypt']);
      open(await tryKey(key));return true;
    }catch(e){try{localStorage.removeItem(KEY)}catch(_){};return false;}
  }
  document.getElementById('lockForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('pwBtn'),err=document.getElementById('pwErr');
    const pw=document.getElementById('pw').value.trim().replace(/[\u2018\u2019\u02BC\u0060\u00B4]/g,"'");
    btn.disabled=true;btn.textContent='Проверяю…';err.textContent='';
    try{
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
      const data=await tryKey(key);
      try{localStorage.setItem(KEY,JSON.stringify({k:b64(await crypto.subtle.exportKey('raw',key)),exp:Date.now()+DAYS*864e5}))}catch(_){}
      open(data);
    }catch(x){err.textContent='Неверный пароль. Проверьте раскладку и регистр букв.';btn.disabled=false;btn.textContent='Открыть';document.getElementById('pw').select();}
  });
  fromSaved().then(ok=>{if(!ok)document.getElementById('pw').focus();});
})();
</script>
